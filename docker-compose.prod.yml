services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.prod
    volumes:
      - static_volume:/app/itemyze/staticfiles
      - media_volume:/app/itemyze/mediafiles
      - db_prod:/app/db_data
    env_file:
      - ./.env.prod
    restart: always
    command: gunicorn --bind 0.0.0.0:8000 itemyze.wsgi:application
    working_dir: /app/itemyze
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/admin/login/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.prod
    ports:
      - '80:80'
    restart: always
    depends_on:
      - backend
    env_file:
      - ./.env.prod
    command: nginx -g "daemon off;"

volumes:
  static_volume:
  media_volume:
  db_prod:
